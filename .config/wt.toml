# Worktrunk project hooks — https://worktrunk.dev
#
# node_modules/ is copied from an existing worktree via APFS clonefile
# (72 MB, seconds), so a full `npm ci` per worktree is not needed.
# Re-run `npm ci` manually after a lockfile change.

[[post-start]]
copy = "wt step copy-ignored"

[pre-merge]
check = "npm run check"
